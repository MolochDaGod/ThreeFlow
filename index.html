<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico" />
  <meta name="keywords" content="Grudge Studio,Warlords Engine,ThreeFlow,three.js,Warlords prefabs,uMMORPG" />
  <meta name="description" content="Grudge Studio Warlords Engine — ThreeFlow fork for era layout, CDN prefabs, Rapier, and MMO AI stamps." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grudge Studio · Warlords Engine</title>
  <style>
    #loading-mark {
      position: absolute;
      inset: 0;
      z-index: 2000;
      width: 100%;
      height: 100%;

      .loading-box {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        transition: opacity 0.3s;
        /* softer background gradient */
        background: linear-gradient(135deg, #1a1408 0%, #0c1018 100%);

        .loading {
          width: 200px;
          height: 120px;
          text-align: center;

          img {
            width: 120px;
            height: 120px;
            /* 添加image过渡效果 */
            opacity: 0.9;
            transition: opacity 0.3s;
          }
        }

        .loading-txt {
          margin-top: 12px;
          font-size: 16px;
          /* 更改文字color为更柔和的色调 */
          color: #c9a227;
          text-align: center;
          letter-spacing: 2px;
          /* softer animation */
          animation: pulse 2s ease-in-out infinite;
        }
      }
    }

    /* pulse keyframes */
    @keyframes pulse {
      0% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.6;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loading-mark">
      <div class="loading-box">
        <div class="loading">
          <img src="./image/loading.svg" />
          <div class="loading-txt">GRUDGE STUDIO</div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
